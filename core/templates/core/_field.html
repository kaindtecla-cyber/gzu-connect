<div>{% if field.field.widget.input_type == 'checkbox' %}<label style="display:flex;gap:8px;align-items:center;color:var(--text)">{{ field }} {{ field.label }}</label>
{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% endif %}
{% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}{{ field.errors }}</div>
