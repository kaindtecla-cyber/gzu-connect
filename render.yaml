# Render Blueprint: a web service plus a Postgres database.
databases:
  - name: gzuconnect-db
    plan: free
services:
  - type: web
    name: gzu-connect
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: gzuconnect-db
          property: connectionString
      # Free plan has no shell, so the admin account is created during the build from these values.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Set SEED_DEMO to 1 (and DEMO_PASSWORD to a private password) to load example vendors and tutors.
      # Payments stay simulated until you switch them on. In the Render dashboard (Environment) add
      # PAYNOW_ID, PAYNOW_KEY, PAYNOW_AUTH_EMAIL and SITE_URL, then change PAYMENTS_MODE to "paynow".
      - key: PAYMENTS_MODE
        value: simulated
      # Optional email alerts: add EMAIL_HOST, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD, DEFAULT_FROM_EMAIL.
      - key: SEED_DEMO
        value: "0"
      - key: DEMO_PASSWORD
        sync: false
